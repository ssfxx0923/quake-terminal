name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Install GNOME packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell libglib2.0-bin python3
      - run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: quake-terminal-sidebar
          path: dist/*.shell-extension.zip
